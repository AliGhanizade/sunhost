<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunHost - Panel</title>
    <link rel="shortcut icon" href="./assets/picture/sun.png" type="image/x-icon">
    <link rel="stylesheet" href="./assets/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="./assets/css/bootstrap.rtl.min.css.map">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body class="bg-light">
    <div class="container-fluid ">
        <div class="row">
            {{template "sidebar" .}}
            <div class="col-lg-10 col-md-12 col-sm-12 p-3">
                <nav class="navbar bg-white border-bottom p-3 mb-4 rounded shadow-sm">
                    <div class="container-fluid">
                        <span class="navbar-brand fw-bold text-secondary">سامانه جامع مانیتورینگ</span>
                        <span class="badge bg-light text-success-emphasis fs-6 border " id="current-time"></span>
                        <span id="fullname" class="fw-bold text-secondary"></span>

                    </div>
                </nav>

                <div class="row g-3 mb-4">
                    <div class="col-6 col-xl-3">
                        <div class="card p-3 border-0 shadow-sm">
                            <span class="text-muted small">بار پردازنده</span>
                            <h4 class="fw-bold my-2" id="cpu-usage">0%</h4>
                            <div class="progress" style="height: 6px;">
                                <div id="cpu-progress" class="progress-bar bg-primary" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-6 col-xl-3">
                        <div class="card p-3 border-0 shadow-sm">
                            <span class="text-muted small">حافظه موقت</span>
                            <h4 class="fw-bold my-2" id="ram-usage">0%</h4>
                            <div class="progress" style="height: 6px;">
                                <div id="ram-progress" class="progress-bar bg-success" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-6 col-xl-3">
                        <div class="card p-3 border-0 shadow-sm">
                            <span class="text-muted small">کاربران فعال</span>
                            <h4 class="fw-bold my-2" id="user-online">0</h4>
                            <div class="progress" style="height: 6px;">
                                <div id="user-progress" class="progress-bar bg-warning" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-6 col-xl-3">
                        <div class="card p-3 border-0 shadow-sm">
                            <span class="text-muted small">ترافیک شبکه</span>
                            <h4 class="fw-bold my-2" id="network-speed">0 Mbps</h4>
                            <div class="progress" style="height: 6px;">
                                <div id="network-progress" class="progress-bar bg-danger" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-4">
                    <h5 class="fw-bold text-dark mb-3"><i class="bi bi-activity text-info me-2"></i>رویدادهای زنده سیستم
                    </h5>
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>زمان ثبت</th>
                                    <th>موضوع فعالیت</th>
                                    <th>کد خطا</th>
                                    <th>سیستم</th>
                                    <th>آدرس IP</th>
                                </tr>
                            </thead>
                            <tbody id="log-table-body">
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>

        </div>
    </div>
    <script src="./assets/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/bootstrap.bundle.min.js.map"></script>

    <script src="./assets/js/panel.js"></script>
</body>

</html>
