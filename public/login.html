<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود و عضویت</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="./assets/css/bootstrap.rtl.min.css.map">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./assets/css/login.css">

</head>

<body>

    <div class="login-container">

        {{template "navbar" .}}

        <div class="card custom-card p-5">

            <div class="collapse show" id="loginArea">
                <div class="text-center mb-5">
                    <h4 class="fw-bold text-dark m-0">ورود</h4>
                    <p class="text-muted small mt-2">خوش آمدید، مشخصات خود را وارد کنید</p>
                </div>

                <form id="loginForm" onsubmit="login(event)">
                    <div class="input-wrapper">
                        <input type="text" id="username-login" class="form-control-custom" placeholder="نام کاربری"
                            required autocomplete="off">
                        <i class="bi bi-person input-icon-left"></i>
                        <span class="input-underline"></span>
                    </div>

                    <div class="input-wrapper">
                        <input type="password" id="password-login" class="form-control-custom" placeholder="رمز عبور"
                            required>
                        <i class="bi bi-shield-lock input-icon-left"></i>
                        <i class="bi bi-eye password-toggle-right" onclick="togglePassword('password-login', this)"></i>
                        <span class="input-underline"></span>
                    </div>

                    <div class="alert alert-custom mb-4" id="error-login"></div>
                    <button type="submit" class="btn btn-submit w-100 mb-4">ورود به سیستم</button>
                </form>

                <div class="text-center">
                    <span class="small text-muted">عضو نیستید؟</span>
                    <button class="btn btn-link btn-sm p-0 ms-1 text-decoration-none text-link"
                        data-bs-toggle="collapse" data-bs-target="#loginArea, #registerArea">ایجاد حساب کاربری</button>
                </div>
            </div>

            <div class="collapse" id="registerArea">
                <div class="text-center mb-5">
                    <h4 class="fw-bold text-dark m-0">عضویت</h4>
                    <p class="text-muted small mt-2">برای شروع مشخصات خود را وارد کنید</p>
                </div>

                <form id="registerForm" onsubmit="register(event)">
                    <div class="row g-3 mb-1">
                        <div class="col-5">
                            <div class="input-wrapper">
                                <input type="text" id="first-name" class="form-control-custom"
                                    placeholder="نام (اختیاری)" autocomplete="off">
                                <span class="input-underline"></span>
                            </div>
                        </div>
                        <div class="col-7">
                            <div class="input-wrapper">
                                <input type="text" id="last-name" class="form-control-custom" placeholder="نام خانوادگی"
                                    required autocomplete="off">
                                <span class="input-underline"></span>
                            </div>
                        </div>
                    </div>

                    <div class="input-wrapper">
                        <input type="text" id="username-register" class="form-control-custom" placeholder="نام کاربری"
                            required autocomplete="off">
                        <i class="bi bi-at input-icon-left"></i>
                        <span class="input-underline"></span>
                    </div>

                    <div class="input-wrapper">
                        <input type="email" id="email-register" class="form-control-custom" placeholder="نشانی ایمیل"
                            required autocomplete="off">
                        <i class="bi bi-envelope input-icon-left"></i>
                        <span class="input-underline"></span>
                    </div>

                    <div class="input-wrapper">
                        <input type="password" id="password-register" class="form-control-custom" placeholder="رمز عبور"
                            required>
                        <i class="bi bi-shield-lock input-icon-left"></i>
                        <i class="bi bi-eye password-toggle-right"
                            onclick="togglePassword('password-register', this)"></i>
                        <span class="input-underline"></span>
                    </div>

                    <div class="input-wrapper">
                        <input type="password" id="password-confirm-register" class="form-control-custom"
                            placeholder="تکرار رمز عبور" required>
                        <i class="bi bi-shield-check input-icon-left"></i>
                        <i class="bi bi-eye password-toggle-right"
                            onclick="togglePassword('password-confirm-register', this)"></i>
                        <span class="input-underline"></span>
                    </div>

                    <div class="alert alert-custom mb-4" id="error-register"></div>
                    <button type="submit" class="btn btn-submit w-100 mb-4">ساخت حساب</button>
                </form>

                <div class="text-center">
                    <span class="small text-muted">قبلاً ثبت‌نام کرده‌اید؟</span>
                    <button class="btn btn-link btn-sm p-0 ms-1 text-decoration-none text-link"
                        data-bs-toggle="collapse" data-bs-target="#loginArea, #registerArea">وارد شوید</button>
                </div>
            </div>

        </div>
    </div>
    {{template "footer" .}}

    <script src="./assets/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/bootstrap.bundle.min.js.map"></script>

    <script src="./assets/js/login.js"></script>
</body>

</html>
